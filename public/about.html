<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>About - WAZWER</title>
    <style>
        body {
            background-color: #2c2935;
            color: white;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 30px;
        }

        a {
            color: #fcd063;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        main {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 1rem;
            padding: 1rem;
            min-height: 70vh;
        }

        iframe {
            width: 100%;
            height: 80vh;
            border: 2px solid #83eec2;
            background: url('images/about_loading.jpg') center center;
            background-size: cover;
        }

        .controls {
            border: 2px solid #83eec2;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .controls a {
            color: #83eec2;
            text-decoration: none;
            border: 1px solid #83eec2;
            padding: 0.5rem;
            text-align: center;
        }

        .controls a:hover {
            background: #83eec2;
            color: #1e1e2f;
        }
    </style>
</head>


<body>
    <header>
        <div
            style="position: fixed; top: 40px; left:120px; background-color: #191525; padding-left:10px; padding-right:10px;">
            <img id="audio-toggle" src="images/ui/audio_mute.png" alt="Play Audio"
                style="cursor: pointer; position: fixed; height:80px; top: 15px; left:0px;">Now
            playing: <a href="https://www.youtube.com/watch?v=eKpae_oto7s" target="_blank"> Falling Star - Flying
                Hands</a>
        </div>
        <audio id="bg-audio" src="https://wazwer.com/sounds/flyinghands.mp3" loop></audio>
        <script>
            const audio = document.getElementById('bg-audio');
            const img = document.getElementById('audio-toggle');
            let isPlaying = false;

            audio.volume = 0.5;

            img.addEventListener('click', () => {
                if (!isPlaying) {
                    audio.play();
                    img.src = 'images/ui/audio_play.png'; // change image to pause
                } else {
                    audio.pause();
                    img.src = 'images/ui/audio_mute.png'; // change image to play
                }
                isPlaying = !isPlaying;
            });
        </script>
    </header>

    <div style="height:60px;"></div>

    <main>
        <iframe name="contentFrame" src="about:blank"></iframe>
        <div class="controls">
            <a href="about_this.html" target="contentFrame">>_Where am I? Who are you?</a>
            <a href="shrines.html" target="contentFrame">>_ What inspires you?</a>
            <a href="resources.html" target="contentFrame">>_How did you make this?</a>
            <a href="cool_sites.html" target="contentFrame">>_Leave the brainframe?</a>
            <!-- <a href="todo.txt" target="contentFrame">>_What's next?</a> -->
        </div>
    </main>

    <footer style="text-align: center; margin-top: 2em;">
        <a href="index.html">- Home Page -</a> <a href="sitemap.html">- Site Map -</a>
    </footer>
</body>

</html>
