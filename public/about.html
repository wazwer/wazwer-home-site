<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>wazwer</title>
    <style>
        body {
            background-color: #2c2935;
            color: white;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 30px;
        }

        a {
            color: #fcd063;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .nameplate {
            font-family: Impact, Chicago, sans-serif;
            font-size: 24px;
            text-align: center;
            letter-spacing: 1px;
            margin: 20px 0;
        }

        .nameplate .line {
            color: #ffffff;
        }

        .chevron-block {
            font-family: monospace;
            display: inline-block;
            background: repeating-linear-gradient(45deg,
                    /* Angle of the stripes */
                    #000000 0px,
                    #000000 6px,
                    #fcd063 6px,
                    #fcd063 12px);
            background-size: 200% 100%;
            /* Wider than 100% for motion loop */
            background-position: 100% 0%;
            /* Start at right */
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: stripes-left-right 6s linear infinite;
            letter-spacing: 0;
        }

        .nameplate .nameColor {
            color: #bf006c;
            margin: 0 8px;
        }

        @keyframes stripes-left-right {
            0% {
                background-position: 100% 0%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            padding: 1rem;
            min-height: 70vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 2px solid #83eec2;
            background: #2e2e3e;
        }

        .controls {
            border: 2px solid #83eec2;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .controls a {
            color: #83eec2;
            text-decoration: none;
            border: 1px solid #83eec2;
            padding: 0.5rem;
            text-align: center;
        }

        .controls a:hover {
            background: #83eec2;
            color: #1e1e2f;
        }
    </style>
</head>


<body>
    <header>
        <div
            style="position: fixed; top: 40px; left:120px; background-color: #191525; padding-left:10px; padding-right:10px;">
            <img id="audio-toggle" src="images/audio_mute.png" alt="Play Audio"
                style="cursor: pointer; position: fixed; height:80px; top: 15px; left:0px;">Now
            playing: <a href="https://www.youtube.com/watch?v=eKpae_oto7s"> Falling Star - Flying Hands</a>
        </div>
        <audio id="bg-audio" src="https://wazwer.com/sounds/flyinghands.mp3" loop></audio>
        <script>
            const audio = document.getElementById('bg-audio');
            const img = document.getElementById('audio-toggle');
            let isPlaying = false;

            audio.volume = 0.5;

            img.addEventListener('click', () => {
                if (!isPlaying) {
                    audio.play();
                    img.src = 'images/audio_play.png'; // change image to pause
                } else {
                    audio.pause();
                    img.src = 'images/audio_mute.png'; // change image to play
                }
                isPlaying = !isPlaying;
            });
        </script>

        <div style="height: 100px;"></div>
        <div class="nameplate">
            <span class="line">◀</span>
            <span class="chevron-block">▒▒▒▒▒▒▒▒▒</span>
            <span class="nameColor">_Kascade-wazwer-Em</span>
            <span class="chevron-block">▒▒▒▒▒▒▒▒▒</span>
            <span class="nameColor">any pronouns</span>
            <span class="chevron-block">▒▒▒▒▒▒▒▒▒</span>
            <span class="nameColor">1997</span>
            <span class="chevron-block">▒▒▒▒▒▒▒▒▒</span>
            <span class="line">▶</span>
        </div>
        <div style="height: 50px;"></div>
    </header>

    <main>
        <iframe name="contentFrame" src="about:blank"></iframe>
        <div class="controls">
            <a href="about_this.html" target="contentFrame">About this site</a>
            <a href="cool_sites.html" target="contentFrame">Cool Sites</a>
            <a href="shrines.html" target="contentFrame">Shrines</a>
            <a href="resources.html" target="contentFrame">Resources</a>
        </div>
    </main>

    <footer style="text-align: center; margin-top: 2em;">
        <a href="index.html">- Home Page -</a> <a href="sitemap.html">- Site Map -</a>
    </footer>
</body>

</html>
