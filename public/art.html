<!DOCTYPE html>
<html>

<head>
    <title>Projects - WAZWER</title>
    <style>
        body {
            background-color: #2c2935;
            color: white;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 30px;
        }

        a {
            color: #fcd063;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        main {
            display: grid;
            grid-template-columns: 4fr 1fr;
            gap: 1rem;
            padding: 1rem;
            min-height: 70vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 2px solid #83eec2;
            background: url('images/about_loading.jpg') center center;
            background-size: cover;
        }

        .controls {

            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .controls a {
            color: #83eec2;
            text-decoration: none;
            text-align: center;
            filter: saturate(25%);
        }

        .controls a:hover {
            filter: brightness(100%);
            filter: saturate(100%);
            translate: -10px;
        }
    </style>
</head>

<body>

    <a href="lava.html"><img src="images/lava_room_button.png" style="width: 500px;"
            onmouseover="this.src='images/lava_room_button_hover.png'"
            onmouseout="this.src='images/lava_room_button.png'"></a>
    <main>
        <iframe name="contentFrame" src="about:blank"></iframe>
        <div class="controls">
            <div style="text-align: center;">Select Character</div>
            <a href="character_pages/kascade.html" target="contentFrame"><img src="character_pages/Kascade_icon.jpg"
                    style="height: 200px;"></a>
            <a href="character_pages/dice.html" target="contentFrame"><img src="character_pages/Dice_icon.jpg"
                    style="height: 200px;"></a>
            <a href="character_pages/jenny.html" target="contentFrame"><img src="character_pages/Jenny_icon.jpg"
                    style="height: 200px;"></a>
            <a href="character_pages/tanzanite.html" target="contentFrame"><img src="character_pages/tanzanite-icon.jpg"
                    style="height: 200px;"></a>
        </div>
    </main>

    <footer style="text-align: center; margin-top: 2em;">
        <a href="index.html">- Home Page -</a> <a href="sitemap.html">- Site Map -</a>
    </footer>
</body>

</html>
