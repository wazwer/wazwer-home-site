<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>wazwer</title>
    <style>
        body {
            background-color: #2c2935;
            color: white;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 30px;
        }

        a {
            color: #fcd063;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .center {
            text-align: center;
        }

        .pixel-kascade-overlay {
            position: absolute;
            /* or absolute if inside a wrapper */
            bottom: -320px;
            /* matches the height of the link bar so she sits on it */
            left: 80%;
            transform: translateX(-400px);
            height: 800px;
            width: auto;
            z-index: 11;
            pointer-events: none;
            /* avoid blocking links */
        }

        .link-bar {
            height: 40px;
            /* Adjust to match image's height */
            background: url('images/Links_Header.png') repeat-x left center;
            background-size: auto 100%;
            /* tile width-wise, scale to bar height */
            position: absolute;
            left: 0;
            width: 100%;
            z-index: 2;
        }

        .link-bar-spacer {
            height: 40px;
            /* match the height of link-bar */
        }

        .status-triangle {
            position: absolute;
            /*CSS triangle trick */
            bottom: 240px;
            /* match iframe's vertical position */
            left: 80%;
            transform: translateX(-150px);
            /* offset to the right edge of iframe + spacing */
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 12px solid #111;
            z-index: 12;
        }

        .button {
            width: 81px;
            height: 33px;
        }

        .double-height-button {
            width: 110px;
            height: 85px;
        }

        .status-line {
            position: absolute;
            bottom: 240px;
            left: 80%;
            transform: translateX(-650px);
            width: 500px;
            height: 25px;
            background-color: #111;
            color: rgb(179, 255, 226);
            font-family: 'Courier New';
            font-size: 16px;
            overflow: hidden;
            white-space: nowrap;
        }

        @keyframes slidePauseSlide {
            0% {
                transform: translateX(150%);
            }

            20% {
                transform: translateX(0%);
            }

            80% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .status-text {
            display: inline-block;
            padding-left: 12px;
            animation: slidePauseSlide 5s linear forwards;
        }
    </style>
</head>

<body>
    <div
        style="position: fixed; top: 40px; left:120px; background-color: #191525; padding-left:10px; padding-right:10px;">
        <img id="audio-toggle" src="images/ui/audio_mute.png" alt="Play Audio"
            style="cursor: pointer; position: fixed; height:80px; top: 15px; left:0px;">Now
        playing: <a href="https://www.youtube.com/watch?v=023a0SVk4ZY"> FM Skyline - Subterranean</a>
    </div>
    <audio id="bg-audio" src="https://wazwer.com/sounds/subterranean.mp3" loop></audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const img = document.getElementById('audio-toggle');
        let isPlaying = false;

        audio.volume = 0.5;

        img.addEventListener('click', () => {
            if (!isPlaying) {
                audio.play();
                img.src = 'images/ui/audio_play.png'; // change image to pause
            } else {
                audio.pause();
                img.src = 'images/ui/audio_mute.png'; // change image to play
            }
            isPlaying = !isPlaying;
        });
    </script>


    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 770px; overflow: hidden; z-index: -1;">
        <div
            style="position: absolute; top: -100px; left: 0; width: 100%; height: 100%; background: url('images/pipes_bg.png') center center; background-size: cover;">
        </div>
    </div>

    <div style="text-align: center;">
        <img src="images/wazwer_emblem.png" alt="wazwer emblem" style="width: 400px; z-index: 4;">
    </div>
    <div style="height: 220px;"></div>

    <div class="link-bar">
        <img src="images/PixelKascade.png" class="pixel-kascade-overlay">

        <div class="status-line" id="statusLine">
            <span class="status-text" id="statusText">STATUS</span>
        </div>
        <div class="status-triangle"></div>
    </div>

    <div class="link-bar-spacer"></div>

    <div style="max-width: 75%; ">
        <a href="about.html"><img src="images/ui/about-button.png"></a>
        <a href="games.html"><img src="images/ui/reviews-button.png"></a>
        <a href="art.html"><img src="images/ui/art-button.png"></a>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px;">
        <div>
            <a href="https://www.mabsland.com/Adoption.html">
                <img src="images/buttons/Censor_Ma.gif">
            </a>
        </div>

        <!-- buttons grid -->
        <div style="display: grid; grid-template-columns: repeat(4, auto); gap: 5px;">
            <a href="https://neocities.org/site/wazwer" target="_blank"><img class="button"
                    src="images/buttons/neocities-2.gif"></a>
            <a href="https://syntheticfruits.neocities.org/" target="_blank"><img class="button"
                    src="images/buttons/syntheticfruits2.gif"></a>
            <a href="https://mileshouse.neocities.org/" target="_blank"><img class="button"
                    src="images/buttons/kiophen.gif"></a>
            <a href="https://www.sonicsatam.com/" target="_blank"><img class="button"
                    src="images/buttons/fansunitedforsatam.png"></a>
            <a href="https://www.wazwer.com/" target="_blank"><img class="button" src="images/buttons/wazwer.gif"></a>
            <a href="https://www.saturdaymorningsonic.com/" target="_blank"><img class="button"
                    src="images/buttons/saturdaymorningsonic.png"></a>
            <a href="https://www.sonicgear.org/" target="_blank"><img class="button"
                    src="images/buttons/sonicgear.jpg"></a>
        </div>

        <div>
            <a href="https://archive.org/" target="_blank">
                <img class="double-height-button" src="images/buttons/internetarchive.jpg">
            </a>
        </div>
    </div>

    <footer style="text-align: center; margin-top: 2em;">
        <a href="sitemap.html">- Site Map -</a>
    </footer>

    <script>
        const messages = [
            "⚙️ Currently gearing up for AF 2025 ⚙️",
            "I was on a snooze cruise I guess!",
            "Creepy 💀 and Cute 🎀 Parts Pack",
            "Genesis does what Nintendon't",
            "The internet is a series of pipe dreams",
            "Find the nabisco thing on nabisco things",
            "For the colony, and oppressed ants everywhere!"
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        shuffle(messages);

        let current = 0;
        const statusText = document.getElementById('statusText');

        function showNextMessage() {
            statusText.style.animation = 'none'; // reset
            void statusText.offsetWidth; // reflow
            statusText.textContent = messages[current];
            statusText.style.animation = 'slidePauseSlide 15s linear forwards';
            current = (current + 1) % messages.length;
        }

        statusText.addEventListener('animationend', showNextMessage);

        showNextMessage();
    </script>



</body>

</html>
