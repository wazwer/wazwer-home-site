        html{

        body {
            background-color: #2c2935;

            font-family: Verdana, Geneva, sans-serif;

        a {

            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .center {
            text-align: center;
        }

        .pixel-kascade-overlay {
            position: absolute;
            bottom: -280px;
            /* matches the height of the link bar so she sits on it */
            left: 80%;
            transform: translateX(-200px);
            height: 700px;
            width: auto;
            z-index: 100;
            pointer-events: none;
            /* avoid blocking links */
        }

        .link-bar {
            height: 40px;
            /* Adjust to match image's height */
            background: url('images/Links_Header.png') repeat-x left center;
            background-size: auto 100%;
            /* tile width-wise, scale to bar height */
            position: absolute;
            left: 0;
            width: 100%;
        }

        .link-bar-spacer {
            height: 40px;
            /* match the height of link-bar */
        }

        .status-triangle {
            position: absolute;
            /*CSS triangle trick */
            bottom: 240px;
            /* match iframe's vertical position */
            left: 80%;
            transform: translateX(-150px);
            /* offset to the right edge of iframe + spacing */
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 12px solid #111;
            z-index: 11;
        }

        .button {
            width: 81px;
            height: 33px;
        }

        .double-height-button {
            width: 110px;
            height: 85px;
        }

        .status-line {
            position: absolute;
            bottom: 240px;
            left: 80%;
            transform: translateX(-650px);
            width: 500px;
            height: 25px;
            background-color: #111;
            color: rgb(179, 255, 226);
            font-family: 'Courier New';
            font-size: 16px;
            overflow: hidden;
            white-space: nowrap;
        }

        @keyframes slidePauseSlide {
            0% {
                transform: translateX(150%);
            }

            20% {
                transform: translateX(0%);
            }

            80% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .status-text {
            display: inline-block;
            padding-left: 12px;
            animation: slidePauseSlide 4s linear forwards;
        }
    </style>

        @keyframes dishswivel {

        @keyframes monitoroff {

        const audio = document.getElementById('bg-audio');

        let isPlaying = false;

            if (!isPlaying) {
                audio.play();
                img.src = 'images/ui/audio_play.png'; // change image to pause

    <script>
        const messages = [
            "⚙️ Currently gearing up for AF 2026 ⚙️",
            "I was on a snooze cruise I guess!",
            "Creepy 💀 and Cute 🎀 Parts Pack",
            "Genesis does what Nintendon't",

            "For the colony, and oppressed ants everywhere!",
            'Do you like Piña Coladas? <a href="pina-colada.html" style="color: rgb(179, 255, 226);">(Link)</a>'
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        shuffle(messages);

        let current = 0;
        const statusText = document.getElementById('statusText');

        function showNextMessage() {
            statusText.style.animation = 'none'; // reset
            void statusText.offsetWidth; // reflow
            statusText.innerHTML = messages[current];
            statusText.style.animation = 'slidePauseSlide 15s linear forwards';
            current = (current + 1) % messages.length;
        }

        statusText.addEventListener('animationend', showNextMessage);

        showNextMessage();
    </script>
